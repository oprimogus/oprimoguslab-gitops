name: nextcloud
repoURL: https://nextcloud.github.io/helm/
targetRevision: 9.4.0
chart: nextcloud
namespace: nextcloud
values: |
    livenessProbe:
      enabled: false
    httpRoute:
      enabled: true
      hostnames:
        - drive.oprimoguslab.xyz
      parentRefs:
        - group: gateway.networking.k8s.io
          kind: Gateway
          name: traefik-gateway
          namespace: traefik
    nextcloud:
      host: drive.oprimoguslab.xyz
      existingSecret:
        enabled: true
        secretName: nextcloud
        usernameKey: nextcloud-username
        passwordKey: nextcloud-password
        tokenKey: nextcloud-token
        smtpUsernameKey: smtp-username
        smtpPasswordKey: smtp-password
        smtpHostKey: smtp-host
      trustedDomains:
        - drive.oprimoguslab.xyz
      mail:
        enabled: true
        fromAddress: user
        domain: oprimoguslab.xyz
      objectStore:
        s3:
          enabled: true
          ssl: false
          port: "8333"
          usePathStyle: true
          region: us-east-1
          autoCreate: false
          existingSecret: nextcloud
          secretKeys:
            host: AWS_ENDPOINTS
            accessKey: AWS_ACCESS_KEY_ID
            secretKey: AWS_SECRET_ACCESS_KEY
            bucket: nextcloud-bucket

    internalDatabase:
      enabled: false
    externalDatabase:
      enabled: true
      type: postgresql
      existingSecret:
        enabled: true
        secretName: nextcloud
        usernameKey: db-user
        passwordKey: db-password
        hostKey: db-host
        databaseKey: db-database
    persistence:
      enabled: true
      existingClaim: nextcloud-pvc
            