name: seaweedfs
repoURL: https://seaweedfs.github.io/seaweedfs/helm
targetRevision: 4.48.0
chart: seaweedfs
namespace: seaweedfs
values: |
    master:
      volumeSizeLimitMB: 1024
    
    allInOne:
      enabled: true
      extraArgs:
        - -volume.max=0
        - -master.volumeSizeLimitMB=1024
      data:
        type: existingClaim
        claimName: seaweedfs-pvc
      s3:
        enabled: true
        enableAuth: true
    
    s3:
      enableAuth: true
      credentials:
        admin:
          existingSecret: seaweedfs
          accessKeyKey: access-key
          secretKeyKey: secret-key