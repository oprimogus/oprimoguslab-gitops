name: zitadel
repoURL: 'https://charts.zitadel.com'
targetRevision: 10.4.0  # Nova versão do chart
chart: zitadel
namespace: zitadel
values: |
  envVarsSecret: zitadel
  zitadel:
    masterkeySecretName: zitadel-masterkey
    configmapConfig:
      ExternalSecure: true
      ExternalDomain: auth.oprimoguslab.xyz
      TLS:
        Enabled: false
      Database:
        Postgres:
          Host: postgres-cluster-rw.cnpg.svc.cluster.local
          Port: 5432
          MaxOpenConns: 20
          MaxIdleConns: 10
          MaxConnLifetime: 30m
          MaxConnIdleTime: 5m
          User:
            SSL:
              Mode: verify-full
          Admin:
            SSL:
              Mode: verify-full
    debug:
      enabled: true
      annotations:
        helm.sh/hook: 'pre-install,pre-upgrade'
        helm.sh/hook-weight: '1'
    dbSslCaCrtSecret: certs-bundle
    dbSslAdminCrtSecret: postgres-cluster-client-cert
    dbSslUserCrtSecret: postgres-cluster-client-cert

  # Ingress Principal do ZITADEL (API, gRPC, etc)
  ingress:
    enabled: true
    className: traefik
    annotations:
      kubernetes.io/ingress.class: traefik
    hosts:
      - host: auth.oprimoguslab.xyz
        paths:
          - path: /
            pathType: Prefix
    tls:
      - hosts:
          - auth.oprimoguslab.xyz
        secretName: cert-tls

  # NOVO: Ingress exclusivo para o Frontend de Login UI (v10+)
  login:
    enabled: true
    ingress:
      enabled: true
      className: traefik
      annotations:
        kubernetes.io/ingress.class: traefik
      hosts:
        - host: auth.oprimoguslab.xyz
          paths:
            - path: /ui/v2/login
              pathType: Prefix
      tls:
        - hosts:
            - auth.oprimoguslab.xyz
          secretName: cert-tls