name: cloudflared
repoURL: https://oprimogus.github.io/helm-charts
targetRevision: 0.1.5
chart: generic-application
namespace: cloudflared
values: |
    name: cloudflared
    
    image:
      repository: cloudflare/cloudflared
      tag: latest
      pullPolicy: Always
    
    resources:
      min:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: 500m
        memory: 256Mi
      autoscaling:
        enable: true
        minReplicas: 1
        maxReplicas: 2

    secrets:
      - name: TOKEN
        secret: cloudflared
        key: token
      - name: cert
        secret: certs-bundle
        key: ca.crt
        mountPath: /etc/cloudflared/cert/tls.crt

    args:
      - "tunnel"
      - "--no-autoupdate"
      - "run"
      - "--token"
      - "$(TOKEN)"
      - "--origin-ca-pool"
      - "/etc/cloudflared/cert/tls.crt"