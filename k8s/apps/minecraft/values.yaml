name: minecraft
repoURL: https://oprimogus.github.io/helm-charts
targetRevision: 0.1.2
chart: generic-application
namespace: minecraft
values: |
    name: minecraft
    
    image:
      repository: itzg/minecraft-server
      tag: java21
      pullPolicy: IfNotPresent
    
    resources:
      min:
        cpu: 1000m
        memory: 2Gi
      max:
        cpu: 4000m
        memory: 8Gi
      autoscaling:
        enable: false
    
    env:
       MEMORY: 4G
       MAX_MEMORY: 8G
       TYPE: FABRIC
       MODRINTH_PROJECTS: |
         fabric-api
         fallingtree
         cloth-config
         skinsrestorer
       EULA: true
       ONLINE_MODE: false
       SERVER_NAME: oprimoguslab-server
       SERVER_PORT: 25565
       # configs uso server
       SPAWN_PROTECTION: 0
       MAX_PLAYERS: 20
       ALLOW_NETHER: true
       ANNOUNCE_PLAYER_ACHIEVEMENTS: true
       SNOOPER_ENABLED: false
    
    persistence:
      enabled: true
      existingClaim: minecraft-data
    
    service:
      enabled: true
      type: ClusterIP
      ports:
        - name: minecraft
          port: 25565
          targetPort: 25565
          protocol: TCP