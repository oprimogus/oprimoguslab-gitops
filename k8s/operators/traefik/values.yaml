name: traefik
repoURL: https://traefik.github.io/charts
targetRevision: 41.4.0
chart: traefik
namespace: traefik
values: |
  ports:
    web:
      redirections:
        entryPoint: web
        to: websecure
        scheme: https
        permanent: true
    websecure:
      tls:
        enabled: true
  providers:
    kubernetesCRD:
      enabled: true
      allowCrossNamespace: true
    kubernetesIngress:
      enabled: true
  ingressRoute:
    dashboard:
      enabled: true