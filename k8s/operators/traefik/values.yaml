name: traefik
repoURL: https://traefik.github.io/charts
targetRevision: 41.4.0
chart: traefik
namespace: traefik
values: |
  ports:
    web:
      http:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
    websecure:
      http:
        tls:
          enabled: true
  providers:
    kubernetesCRD:
      enabled: true
      allowCrossNamespace: true
    kubernetesIngress:
      enabled: true
    kubernetesGateway:
      enabled: true
  ingressRoute:
    dashboard:
      enabled: true
  gateway:
    listeners:
      web:
        namespacePolicy:
          from: All