name: kube-prometheus-stack
repoURL: https://prometheus-community.github.io/helm-charts
targetRevision: 88.6.3
chart: kube-prometheus-stack
namespace: monitoring
values: |
    grafana:
      admin:
        existingSecret: kube-prometheus-stack
        userKey: grafanaAdminUser
        passwordKey: grafanaAdminPassword
      persistence:
        enabled: true
        type: pvc
        existingClaim: kube-prometheus-data
      ingress:
        enabled: true
        hosts:
          - "grafana.oprimoguslab.xyz"