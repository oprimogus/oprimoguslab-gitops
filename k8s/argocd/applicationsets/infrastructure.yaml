apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/oprimogus/oprimoguslab-gitops.git
        revision: talos
        directories:
          - path: k8s/infrastructure/*
  template:
    metadata:
      name: '{{path.basename}}'
    spec:
      project: '{{path[3]}}'
      source:
        repoURL: https://github.com/oprimogus/oprimoguslab-gitops.git
        targetRevision: talos
        path: '{{path}}'
      destination:
        server: https://kubernetes.default.svc
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false