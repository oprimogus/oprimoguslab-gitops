apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
spec:
  generators:
    - git:
        repoURL: https://github.com/oprimogus/oprimoguslab-gitops.git
        revision: talos
        files:
          - path: "k8s/infrastructure/*/app.yaml"
  template:
    metadata:
      name: '{{name}}'
      namespace: argocd
    spec:
      project: infrastructure
      source:
        repoURL: 'https://github.com/oprimogus/oprimoguslab-gitops.git'
        targetRevision: talos
        path: '{{path.path}}'
        directory:
          exclude: 'app.yaml'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{namespace}}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true