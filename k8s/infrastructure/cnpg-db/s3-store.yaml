apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
    name: s3-store
    namespace: cnpg
spec:
    configuration:
        destinationPath: s3://cnpg-backup/
        endpointURL: https://554de8cc38b04a6604fd75d0847841b3.r2.cloudflarestorage.com
        s3Credentials:
            accessKeyId:
                name: cloudflare-r2
                key: AWS_ACCESS_KEY_ID
            secretAccessKey:
                name: cloudflare-r2
                key: AWS_SECRET_ACCESS_KEY
        wal:
            compression: gzip
        retentionPolicy: "14d"
