apiVersion: v1
kind: PersistentVolume
metadata:
name: vault-data-pv
spec:
capacity:
    storage: 4Gi
volumeMode: Filesystem
accessModes:
    - ReadWriteOnce
persistentVolumeReclaimPolicy: Retain
storageClassName: longhorn-retain
csi:
  driver: driver.longhorn.io
  volumeAttributes:
  numberOfReplicas: "1"
  staleReplicaTimeout: "20"
  volumeHandle: pvc-22453db7-4afe-4d20-962d-83d592581082