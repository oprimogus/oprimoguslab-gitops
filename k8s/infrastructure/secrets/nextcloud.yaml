apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  # Nome do recurso ExternalSecret (não é o nome da Secret criada)
  name: nextcloud
  # Namespace onde o ExternalSecret e a Secret serão criados
  namespace: nextcloud
spec:
  # Intervalo de atualização para sincronizar com o Vault
  refreshInterval: "15s"
  secretStoreRef:
    # Nome do SecretStore que aponta para o Vault
    name: vault-backend
     # Tipo do SecretStore (pode ser ClusterSecretStore também)
    kind: ClusterSecretStore
  target:
    # Nome da Secret do Kubernetes que será criada com os dados do Vault
    name: nextcloud
  data:   
    # Nome da chave dentro da Secret do Kubernetes (ex: será montada como um arquivo se usado como volume)
    - secretKey: nextcloud-username
      remoteRef:
        # Caminho no Vault (sem o prefixo 'kv/data/') onde está o segredo
        key: apps/nextcloud
        # Nome da chave dentro da secret do Vault (ex: se seu JSON estiver salvo no campo 'JSON')
        property: nextcloud-username
        
    # Nome da chave dentro da Secret do Kubernetes (ex: será montada como um arquivo se usado como volume)
    - secretKey: nextcloud-password
      remoteRef:
        # Caminho no Vault (sem o prefixo 'kv/data/') onde está o segredo
        key: apps/nextcloud
        # Nome da chave dentro da secret do Vault (ex: se seu JSON estiver salvo no campo 'JSON')
        property: nextcloud-password

    # Nome da chave dentro da Secret do Kubernetes (ex: será montada como um arquivo se usado como volume)
    - secretKey: nextcloud-token
      remoteRef:
        # Caminho no Vault (sem o prefixo 'kv/data/') onde está o segredo
        key: apps/nextcloud
        # Nome da chave dentro da secret do Vault (ex: se seu JSON estiver salvo no campo 'JSON')
        property: nextcloud-token

    # Nome da chave dentro da Secret do Kubernetes (ex: será montada como um arquivo se usado como volume)
    - secretKey: smtp-username
      remoteRef:
        # Caminho no Vault (sem o prefixo 'kv/data/') onde está o segredo
        key: infra/resend
        # Nome da chave dentro da secret do Vault (ex: se seu JSON estiver salvo no campo 'JSON')
        property: smtp-user

    # Nome da chave dentro da Secret do Kubernetes (ex: será montada como um arquivo se usado como volume)
    - secretKey: smtp-password
      remoteRef:
        # Caminho no Vault (sem o prefixo 'kv/data/') onde está o segredo
        key: infra/resend
        # Nome da chave dentro da secret do Vault (ex: se seu JSON estiver salvo no campo 'JSON')
        property: nextcloud-password

    # Nome da chave dentro da Secret do Kubernetes (ex: será montada como um arquivo se usado como volume)
    - secretKey: smtp-host
      remoteRef:
        # Caminho no Vault (sem o prefixo 'kv/data/') onde está o segredo
        key: infra/resend
        # Nome da chave dentro da secret do Vault (ex: se seu JSON estiver salvo no campo 'JSON')
        property: smtp-host

    # Nome da chave dentro da Secret do Kubernetes (ex: será montada como um arquivo se usado como volume)
    - secretKey: AWS_ENDPOINTS
      remoteRef:
        # Caminho no Vault (sem o prefixo 'kv/data/') onde está o segredo
        key: infra/seaweedfs
        # Nome da chave dentro da secret do Vault (ex: se seu JSON estiver salvo no campo 'JSON')
        property: AWS_ENDPOINTS

    # Nome da chave dentro da Secret do Kubernetes (ex: será montada como um arquivo se usado como volume)
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        # Caminho no Vault (sem o prefixo 'kv/data/') onde está o segredo
        key: infra/seaweedfs
        # Nome da chave dentro da secret do Vault (ex: se seu JSON estiver salvo no campo 'JSON')
        property: AWS_ACCESS_KEY_ID

    # Nome da chave dentro da Secret do Kubernetes (ex: será montada como um arquivo se usado como volume)
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        # Caminho no Vault (sem o prefixo 'kv/data/') onde está o segredo
        key: infra/seaweedfs
        # Nome da chave dentro da secret do Vault (ex: se seu JSON estiver salvo no campo 'JSON')
        property: AWS_SECRET_ACCESS_KEY

    # Nome da chave dentro da Secret do Kubernetes (ex: será montada como um arquivo se usado como volume)
    - secretKey: nextcloud-bucket
      remoteRef:
        # Caminho no Vault (sem o prefixo 'kv/data/') onde está o segredo
        key: apps/nextcloud
        # Nome da chave dentro da secret do Vault (ex: se seu JSON estiver salvo no campo 'JSON')
        property: nextcloud-bucket

    # Nome da chave dentro da Secret do Kubernetes (ex: será montada como um arquivo se usado como volume)
    - secretKey: db-user
      remoteRef:
        # Caminho no Vault (sem o prefixo 'kv/data/') onde está o segredo
        key: infra/cnpg/database/nextcloud
        # Nome da chave dentro da secret do Vault (ex: se seu JSON estiver salvo no campo 'JSON')
        property: user

    # Nome da chave dentro da Secret do Kubernetes (ex: será montada como um arquivo se usado como volume)
    - secretKey: db-password
      remoteRef:
        # Caminho no Vault (sem o prefixo 'kv/data/') onde está o segredo
        key: infra/cnpg/database/nextcloud
        # Nome da chave dentro da secret do Vault (ex: se seu JSON estiver salvo no campo 'JSON')
        property: password

    # Nome da chave dentro da Secret do Kubernetes (ex: será montada como um arquivo se usado como volume)
    - secretKey: db-host
      remoteRef:
        # Caminho no Vault (sem o prefixo 'kv/data/') onde está o segredo
        key: apps/nextcloud
        # Nome da chave dentro da secret do Vault (ex: se seu JSON estiver salvo no campo 'JSON')
        property: db-host

    # Nome da chave dentro da Secret do Kubernetes (ex: será montada como um arquivo se usado como volume)
    - secretKey: db-database
      remoteRef:
        # Caminho no Vault (sem o prefixo 'kv/data/') onde está o segredo
        key: apps/nextcloud
        # Nome da chave dentro da secret do Vault (ex: se seu JSON estiver salvo no campo 'JSON')
        property: db-database